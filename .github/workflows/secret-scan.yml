name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded pull-request runs are cancelled. Runs on main never are: a cancelled scan of a pushed
# commit would be a gap in coverage.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # One place for the scanner version, so the scan and the self-test always use the same one.
  # Pinned on purpose: bump it deliberately, not by accident.
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1

jobs:
  gitleaks:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # A scan that silently stops detecting is worse than no scan. Prove, on every run, that the scanner
      # still finds secrets, before trusting its "no leaks" answer below.
      # gitleaks exits 1 when it finds leaks. Any other non-zero code means it crashed, and 0 means it found
      # nothing: both must fail this step.
      - name: Self-test (the scanner must detect planted secrets)
        run: |
          rand() { openssl rand -base64 96 | tr -dc "$1" | cut -c1-"$2"; }
          T=$(mktemp -d)
          git -C "$T" init -q
          git -C "$T" config user.email ci@example.invalid
          git -C "$T" config user.name ci
          # Entirely fake, randomly generated, realistic-looking secrets. (Famous example keys are on
          # scanners' allowlists, so they would not prove anything.)
          printf 'GITHUB_TOKEN=ghp_%s\nAWS_ACCESS_KEY_ID=AKIA%s\nSTRIPE_KEY=sk_live_%s\n' \
            "$(rand 'A-Za-z0-9' 36)" "$(rand 'A-Z2-7' 16)" "$(rand 'A-Za-z0-9' 24)" > "$T/planted.env"
          git -C "$T" add -A
          git -C "$T" commit -q -m "planted fake secrets"
          code=0
          out=$(docker run --rm -v "$T":/repo:ro "$GITLEAKS_IMAGE" git /repo --redact --no-banner 2>&1) || code=$?
          if [ "$code" -ne 1 ] || ! printf '%s' "$out" | grep -q "leaks found: 3"; then
            echo "SELF-TEST FAILED: expected exit code 1 and 'leaks found: 3', got exit code $code." >&2
            printf '%s\n' "$out" | tail -5 >&2
            exit 1
          fi
          echo "Self-test passed: the scanner detects all 3 planted secrets."

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the full git history
        run: docker run --rm -v "$PWD":/repo:ro "$GITLEAKS_IMAGE" git /repo --redact --no-banner
